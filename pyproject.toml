[project]
name = "muffin-session"
version = "2.6.0"
description = "Signed Cookie-Based HTTP sessions for the Muffin framework"
authors = [{ name = "Kirill Klenov", email = "horneds@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.rst"
license = "MIT"
keywords = ["asyncio", "trio", "asgi", "muffin", "web", "cookie", "sessions", "session"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Framework :: AsyncIO",
  "Framework :: Trio",
]
dependencies = [
  "asgi-sessions>=1,<2",
  "muffin",
  "pyjwt",
]

[project.optional-dependencies]
jwt = ["pyjwt"]
fernet = ["cryptography"]

[project.urls]
Homepage = "https://github.com/klen/muffin-session"
Repository = "https://github.com/klen/muffin-session"

[dependency-groups]
dev = [
  "pytest",
  "pytest-aio[curio, trio]",
  "ruff",
  "pyrefly",
  "pre-commit",
  "tox",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "muffin_session"
module-root = ""

[tool.pytest.ini_options]
addopts = "-lxsv tests.py"
log_cli = true

[tool.pyrefly]
project-includes = ["muffin_session"]
project-excludes = ["tests.py", "pyproject.toml"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311,py312,py313,py314,py315,pypy311

[testenv]
allowlist_externals = uv,pytest
commands =
  uv pip install --system -e .[dev]
	pytest tests.py
"""

[tool.ruff]
include = ["muffin_session", "tests.py"]
line-length = 100
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A003",
  "ANN",
  "ARG",
  "COM",
  "CPY001",
  "D",
  "DJ",
  "EM",
  "FA100",
  "FIX",
  "N",
  "PLC0415",
  "PLR0912",
  "PLR2004",
  "RET",
  "RSE",
  "RUF012",
  "S101",
  "SLF",
  "TD",
  "TRY003",
  "UP",
]

[tool.bumpversion]
current_version = "2.6.0"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
